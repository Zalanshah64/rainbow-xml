name: Tests

on:
    push:
    pull_request:

jobs:
    test:
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, windows-latest, macos-latest]
        steps:
            - uses: actions/checkout@v7

            - uses: actions/setup-node@v5
              with:
                  node-version: 22
                  cache: npm

            - run: npm ci

            - run: npm test

            # Catches packaging problems (bad manifest, missing files) before a release does.
            - name: Package
              run: npx vsce package
